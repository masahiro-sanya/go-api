openapi: 3.0.3
info:
  title: Go API
  description: Go API with Echo framework
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /hello:
    get:
      summary: Hello World endpoint
      description: Returns a hello world message
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello, World!"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-01T00:00:00Z"
components:
  schemas: {} 